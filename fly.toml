# fly.toml app configuration file generated for transfermarkt-api on 2026-10-03T20:55:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'transfermarkt-api'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
