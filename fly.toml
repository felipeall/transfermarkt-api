# fly.toml app configuration file generated for transfermarkt-api on 2024-04-06T13:49:40-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'transfermarkt-api'
primary_region = 'ams'

[build]

[env]
  RATE_LIMITING_ENABLE = 'true'
  RATE_LIMITING_FREQUENCY = '2/3seconds'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Cap in-flight requests per machine so a burst is queued or refused by the Fly proxy
  # instead of starving the app and failing the health check.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
  memory_mb = 1024
  cpu_kind = 'shared'
  cpus = 1
