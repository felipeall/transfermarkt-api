name: Live Smoke Tests
# Runs the `live` tests against Transfermarkt's JSON API. A failure means upstream access or payloads changed,
# not necessarily a code regression.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "app/tfmkt/**"
      - ".github/workflows/live.yml"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest -m live
        run: uv run pytest -m live
