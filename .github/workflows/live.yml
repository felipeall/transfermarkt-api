name: Live Smoke Tests
# Manual only for now: GitHub runners use cloud IPs, which Transfermarkt's website WAF challenges.
# Add a nightly schedule once endpoints are served from the JSON API.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pytest -m live
        run: uv run pytest -m live
