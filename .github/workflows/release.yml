name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v5.0.0)
        required: true
        type: string
      repository:
        description: Package repository
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}-${{ inputs.repository || 'pypi' }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.12"
          enable-cache: false
      - name: Verify release tag and versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python scripts/check_release.py "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Build wheel and sdist once
        run: uv build --no-sources
      - name: Verify the release wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/release-core"
          uv pip install --python "$RUNNER_TEMP/release-core/bin/python" dist/*.whl
          cp scripts/check_distribution.py "$RUNNER_TEMP/check_distribution.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-core/bin/python" check_distribution.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.repository || 'pypi' }}
      url: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/project/transfermarkt-api/' || 'https://pypi.org/project/transfermarkt-api/' }}
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Publish verified artifacts with OIDC
        env:
          PUBLISH_URL: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          CHECK_URL: ${{ inputs.repository == 'testpypi' && 'https://test.pypi.org/simple/' || 'https://pypi.org/simple/' }}
        run: uv publish --trusted-publishing always --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" dist/*
