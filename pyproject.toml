[project]
name = "transfermarkt-api"
version = "4.3.0"
description = "Async Python SDK and HTTP service for Transfermarkt data"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cachetools>=7.2,<8",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13,<3",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.142.2,<1",
    "limits>=5.8,<6",
    "pydantic-settings>=2.15,<3",
    "uvicorn[standard]>=0.54,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transfermarkt_api"]

[tool.hatch.build.targets.sdist]
include = ["transfermarkt_api", "app", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "pyright>=1.1.400,<2",
]

[tool.ruff]
preview = true
unsafe-fixes = true
line-length = 120
target-version = "py312"
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "COM",  # flake8-commas
    "Q",  # flake8-quotes
    "FAST",  # fastapi
    "ANN",  # type hints
    "D102",  # docstring: public method
    "D103",  # docstring: public function
    "D107",  # docstring: __init__
]
lint.ignore = [
    "COM812",  # conflicts with ruff format
    "ANN401",  # Any is allowed for JSON payloads
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not live'"
testpaths = ["tests"]
markers = [
    "live: hits real Transfermarkt upstreams; run with `-m live`",
]
