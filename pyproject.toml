[project]
name = "transfermarkt-api"
version = "4.2.0"
description = "API service to get data from Transfermarkt"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cachetools==7.2.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "limits==5.8.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
preview = true
unsafe-fixes = true
line-length = 120
target-version = "py312"
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "COM",  # flake8-commas
    "Q",  # flake8-quotes
    "FAST",  # fastapi
    "ANN",  # type hints
    "D102",  # docstring: public method
    "D103",  # docstring: public function
    "D107",  # docstring: __init__
]
lint.ignore = [
    "COM812",  # conflicts with ruff format
    "ANN401",  # Any is allowed for JSON payloads
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not live'"
testpaths = ["tests"]
markers = [
    "live: hits real Transfermarkt upstreams; run with `-m live`",
]
