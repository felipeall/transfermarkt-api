[project]
name = "transfermarkt-api"
version = "4.0.2"
description = "API service to get data from Transfermarkt"
authors = [{ name = "Felipe Allegretti", email = "felipe@allegretti.me" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cachetools>=5.5",
    "fastapi>=0.115.6",
    "httpx>=0.28",
    "limits>=5.8",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
preview = true
unsafe-fixes = true
line-length = 120
target-version = "py312"
lint.select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "COM",  # flake8-commas
    "Q",  # flake8-quotes
    "FAST",  # fastapi
    "ANN",  # type hints
    "D102",  # docstring: public method
    "D103",  # docstring: public function
    "D107",  # docstring: __init__
]
lint.ignore = [
    "COM812",  # conflicts with ruff format
    "ANN401",  # Any is allowed for JSON payloads
]

[tool.pytest.ini_options]
addopts = "--strict-markers -m 'not live'"
testpaths = ["tests"]
markers = [
    "live: hits real Transfermarkt upstreams; run with `-m live`",
]
